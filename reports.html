<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обратная связь — Lixwey</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        h1 { color: #1456A0; margin-bottom: 8px; }
        .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 16px;
            background: #fafafa;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4A90D9;
            background: white;
        }
        textarea { resize: vertical; min-height: 120px; }
        button {
            width: 100%;
            padding: 14px;
            background: #4A90D9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1456A0; }
        .back {
            display: inline-block;
            margin-bottom: 16px;
            color: #4A90D9;
            text-decoration: none;
        }
        .consent-label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: normal;
            font-size: 13px;
            cursor: pointer;
        }
        .consent-label input {
            width: auto;
            margin-top: 3px;
            cursor: pointer;
        }
        .consent-label a {
            color: #4A90D9;
            text-decoration: none;
        }
        .consent-label a:hover {
            text-decoration: underline;
        }
        /* Скрываем поле для своего типа, пока не выбран "Другое" */
        #custom-type-group {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← На главную</a>
        <div class="card">
            <h1>Обратная связь</h1>
            <p class="subtitle">Опишите проблему или предложение. Мы обязательно рассмотрим.</p>

            <!-- Не забудь заменить ТВОЙ_КОД на реальный код из Formspree -->
            <form action="https://formspree.io/f/ТВОЙ_КОД" method="POST" id="report-form">
                
                <label for="username">Ваш Username (никнейм)</label>
                <input type="text" id="username" name="username" placeholder="@username или просто ник" required>

                <label for="type">Тип обращения</label>
                <select id="type" name="type" required onchange="toggleCustomType()">
                    <option value="bug">Баг</option>
                    <option value="suggestion">Предложение</option>
                    <option value="abuse">Жалоба на пользователя</option>
                    <option value="other">Другое</option>
                </select>

                <!-- Поле для своего типа (появляется при выборе "Другое") -->
                <div id="custom-type-group">
                    <label for="custom_type">Уточните тип обращения</label>
                    <input type="text" id="custom_type" name="custom_type" placeholder="Например: Проблема с оплатой">
                </div>

                <label for="email">Ваш email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="message">Сообщение</label>
                <textarea id="message" name="message" placeholder="Опишите ситуацию..." required></textarea>

                <!-- ГАЛОЧКА СОГЛАСИЯ -->
                <label class="consent-label">
                    <input type="checkbox" name="consent" required>
                    <span>
                        Я согласен на обработку моих персональных данных (username, email и текст сообщения) 
                        в соответствии с <a href="/privacy" target="_blank">Политикой конфиденциальности</a>.
                    </span>
                </label>

                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <script>
        function toggleCustomType() {
            const typeSelect = document.getElementById('type');
            const customGroup = document.getElementById('custom-type-group');
            const customInput = document.getElementById('custom_type');

            if (typeSelect.value === 'other') {
                customGroup.style.display = 'block';
                customInput.setAttribute('required', 'required');
            } else {
                customGroup.style.display = 'none';
                customInput.removeAttribute('required');
            }
        }
    </script>
</body>
</html>

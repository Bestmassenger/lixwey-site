<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обратная связь — Lixwey</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <!-- Подключаем общий файл стилей -->
  <link rel="stylesheet" href="../css/style.css">
  
  <style>
    /* Стили только для формы (чтобы не засорять общий файл) */
    .form-section {
      padding: 60px 0 80px;
      display: flex;
      justify-content: center;
    }

    .form-card {
      width: 100%;
      max-width: 680px;
      padding: 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .form-heading {
      margin-bottom: 26px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .form-heading h2 { font-size: 21px; letter-spacing: -.02em; }
    .form-heading p { color: var(--muted); font-size: 14px; }

    .field { margin-bottom: 20px; }
    .field-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text); }
    .optional { color: var(--muted); font-size: 12px; font-weight: 400; }

    .control {
      display: block; width: 100%; min-height: 48px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 12px;
      background: rgba(5, 9, 18, 0.4); color: var(--text);
      font-size: 15px; font-family: inherit;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .control::placeholder { color: #78849d; }
    .control:focus {
      outline: none; border-color: var(--accent-2);
      background: rgba(5, 9, 18, 0.65); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.16);
    }
    select.control option { background: var(--bg-soft); color: var(--text); }
    textarea.control { 
      min-height: 140px; 
      max-height: 400px; /* Максимальная высота */
      resize: none;      /* Запрещаем ручное изменение размера */
      overflow-y: hidden; /* Скрываем скролл, пока не достигнут максимум */
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
    }

    .upload-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; min-height: 120px; padding: 22px 16px;
      border: 1px dashed rgba(158, 171, 204, 0.38); border-radius: 16px;
      background: rgba(74, 144, 217, 0.04); text-align: center; cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .upload-zone:hover { border-color: var(--accent-2); background: rgba(124, 92, 255, 0.08); }
    .upload-zone svg { width: 28px; height: 28px; color: var(--accent-2); }
    .upload-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .upload-description { font-size: 12px; color: var(--muted); }
    .file-input { display: none; }
    .file-counter { font-size: 12px; color: var(--muted); }

    .preview-container { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    .preview-container:empty { display: none; }
    .preview-item { position: relative; width: 94px; height: 94px; border: 1px solid var(--border); border-radius: 14px; background: var(--bg-soft); }
    .preview-item img { display: block; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
    .remove-btn {
      position: absolute; top: -6px; right: -6px; display: grid; place-items: center;
      width: 28px; height: 28px; padding: 0; border: 2px solid var(--bg);
      border-radius: 50%; background: #dd4965; color: white;
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .remove-btn:hover { background: #bb3450; }

    .consent-label {
      display: flex; align-items: flex-start; gap: 12px; margin: 24px 0;
      color: var(--muted); font-size: 13px; line-height: 1.6; cursor: pointer;
    }
    .consent-label input { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: var(--accent-2); cursor: pointer; }
    .consent-label a { color: var(--accent-2); text-decoration: underline; text-underline-offset: 3px; }
    .consent-label a:hover { color: #a99aff; }
    
    .submit-btn { width: 100%; min-height: 52px; font-size: 16px; margin-top: 10px; }
    
    @media (max-width: 600px) {
      .form-card { padding: 22px 18px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>

  <!-- Навигация 1-в-1 -->
  <nav class="nav">
    <div class="container nav-inner">
      <!-- Логотип и Главная -->
      <a href="/" class="logo">
          <img src="../favicon.png" alt="Логотип Lixwey" class="logo-img">
          Lixwey
      </a>
      <div class="nav-links">
        <a href="/#news">Новости</a>
        <a href="/#download">Скачать</a>
        <a href="/#status">Статус</a>
        <a href="index.html" class="btn btn-ghost" style="border-color: var(--accent); color: var(--accent);">Обратная связь</a>
      </div>
    </div>
  </nav>

  <!-- Форма -->
  <main class="container form-section">
    <section class="form-card">
      <div class="form-heading">
        <h2>Новое обращение</h2>
      </div>

      <form id="report-form" enctype="multipart/form-data">
        
        <div class="field">
          <label for="report_type" class="field-label">Тип обращения</label>
          <select id="report_type" name="report_type" class="control" required>
            <option value="bug">Ошибка в приложении</option>
            <option value="suggestion">Предложение по улучшению</option>
            <option value="abuse">Жалоба на пользователя</option>
            <option value="other">Другое</option>
          </select>
        </div>

        <div class="field" id="custom-type-group" hidden>
          <label for="custom_type" class="field-label">Уточните тип обращения</label>
          <input 
            type="text" 
            id="custom_type" 
            name="custom_type" 
            class="control" 
            placeholder="Кратко укажите тему обращения" 
            minlength="3" 
            maxlength="100" 
            disabled
          >
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="email" class="field-label">Ваш email</label>
            <input type="email" id="email" name="email" class="control" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="username" class="field-label">
              Username <span class="optional">— необязательно</span>
            </label>
            <input type="text" id="username" name="username" class="control" placeholder="@username" maxlength="64">
          </div>
        </div>

        <div class="field">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
            <label for="message" class="field-label">Сообщение</label>
            <span class="file-counter" id="message-counter" style="color: #fbbf24;">Мин. 20 символов</span>
          </div>
          
          <textarea 
            id="message" 
            name="message" 
            class="control" 
            placeholder="Расскажите, что произошло или что вы хотите улучшить..." 
            minlength="20" 
            maxlength="3000" 
            required
            oninput="autoResize(this); updateMessageCounter(this);"
            rows="1"
          ></textarea>
        </div>

        <div class="field">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
            <span class="field-label" id="images-label">Скриншоты <span class="optional">— необязательно</span></span>
            <span class="file-counter" id="file-counter">0 из 3</span>
          </div>

          <input type="file" id="images" name="images" class="file-input" accept="image/jpeg,image/png,image/webp" multiple>
          
          <label for="images" class="upload-zone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4"></path>
              <path d="m7 9 5-5 5 5"></path>
              <path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path>
            </svg>
            <span class="upload-title">Выбрать изображения</span>
            <span class="upload-description">JPG, PNG или WebP · до 3 файлов · до 5 МБ каждый</span>
          </label>

          <div class="preview-container" id="preview-container"></div>
        </div>

        <label class="consent-label">
          <input type="checkbox" name="consent" value="accepted" required>
          <span>
            Я согласен на обработку моих персональных данных (email, username, текста сообщения и вложений) в соответствии с 
            <a href="../privacy/" target="_blank" rel="noopener noreferrer">Политикой конфиденциальности</a>.
          </span>
        </label>

        <button type="submit" class="btn btn-primary submit-btn">
          <span>Отправить обращение</span>
        </button>
      </form>
    </section>
  </main>

  <!-- Подвал 1-в-1 -->
  <footer>
    <div class="container footer-inner">
      <span>© 2026 Lixwey. Все права защищены.</span>
      <div class="footer-links">
        <a href="/reports/">Поддержка</a>
        <a href="/#status">Статус</a>
        <a href="/#download">Приложение</a>
      </div>
    </div>
  </footer>

  <script>
    const form = document.getElementById("report-form");
    const typeSelect = document.getElementById("type");
    const customGroup = document.getElementById("custom-type-group");
    const customInput = document.getElementById("custom_type");
    const fileInput = document.getElementById("images");
    const previewContainer = document.getElementById("preview-container");
    const fileCounter = document.getElementById("file-counter");

    const MAX_FILES = 3;
    const MAX_FILE_SIZE = 5 * 1024 * 1024;
    const ALLOWED_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);
    let selectedFiles = [];
    let previewUrls = [];

    function toggleCustomType() {
      const isOther = typeSelect.value === "other";
      customGroup.hidden = !isOther;
      customInput.required = isOther;
      customInput.disabled = !isOther;
    }
    typeSelect.addEventListener("change", toggleCustomType);
    toggleCustomType();

    function releasePreviewUrls() {
      previewUrls.forEach(url => URL.revokeObjectURL(url));
      previewUrls = [];
    }

    function renderPreviews() {
      releasePreviewUrls();
      previewContainer.replaceChildren();
      fileCounter.textContent = `${selectedFiles.length} из ${MAX_FILES}`;

      selectedFiles.forEach((file, index) => {
        const item = document.createElement("div");
        item.className = "preview-item";
        const image = document.createElement("img");
        const url = URL.createObjectURL(file);
        previewUrls.push(url);
        image.src = url;
        
        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-btn";
        removeButton.textContent = "×";
        removeButton.addEventListener("click", () => {
          selectedFiles.splice(index, 1);
          isFormDirty = true; // <--- Добавь эту строку
          renderPreviews();
        });

        item.append(image, removeButton);
        previewContainer.appendChild(item);
      });
    }

    fileInput.addEventListener("change", () => {
      const incomingFiles = Array.from(fileInput.files || []);
      incomingFiles.forEach(file => {
        if (!ALLOWED_TYPES.has(file.type)) return;
        if (file.size > MAX_FILE_SIZE) return;
        if (selectedFiles.some(f => f.name === file.name && f.size === file.size)) return;
        if (selectedFiles.length >= MAX_FILES) return;
        selectedFiles.push(file);
      });
      fileInput.value = "";
      renderPreviews();
    });

    form.addEventListener("formdata", event => {
      event.formData.delete("images");
      selectedFiles.forEach(file => {
        event.formData.append("images", file, file.name);
      });
    });

    function updateMessageCounter(textarea) {
      const counter = document.getElementById('message-counter');
      const minLength = 20;
      const maxLength = 3000;
      const currentLength = textarea.value.length;

      if (currentLength < minLength) {
        // Пока меньше 10 символов — показываем, сколько не хватает
        const remaining = minLength - currentLength;
        counter.textContent = `Минимум ${remaining} симв.`;
        counter.style.color = '#fbbf24'; // Желтый цвет (предупреждение)
      } else {
        // Когда набрали минимум — показываем, сколько осталось до максимума
        const remaining = maxLength - currentLength;
        counter.textContent = `Осталось ${remaining} симв.`;
        counter.style.color = 'var(--muted)'; // Обычный серый цвет
      }
    }

    function autoResize(textarea) {
      textarea.style.height = 'auto'; // Сбрасываем высоту
      // Устанавливаем высоту по содержимому, но не больше max-height (400px)
      const newHeight = Math.min(textarea.scrollHeight, 400); 
      textarea.style.height = newHeight + 'px';
      
      // Если текст превышает 400px, включаем скролл
      if (textarea.scrollHeight > 400) {
        textarea.style.overflowY = 'auto';
      } else {
        textarea.style.overflowY = 'hidden';
      }
    }

      // Защита от случайного закрытия/обновления страницы
    let isFormDirty = false;

    // Отслеживаем любые изменения в полях формы
    form.addEventListener("input", () => {
      isFormDirty = true;
    });

    // Отслеживаем добавление файлов (они не вызывают событие 'input')
    fileInput.addEventListener("change", () => {
      isFormDirty = true;
    });

    // Также отслеживаем удаление файлов (через крестики)
    // (вызывается внутри функции renderPreviews, мы добавим это туда чуть позже)

    // Слушаем попытку закрыть/обновить страницу
    window.addEventListener("beforeunload", (event) => {
      if (isFormDirty) {
        // Стандартный вызов для показа окна браузера
        event.preventDefault();
        // Для старых браузеров
        event.returnValue = "";
      }
    });



        // --- Отправка формы на API ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // ⬅️ Это блокирует переход по URL
      e.stopPropagation();

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.textContent = "Отправка...";

      // Собираем данные формы
      const formData = new FormData(form);
      
      // Добавляем выбранные картинки (так как мы их удаляем из input вручную)
      formData.delete("images");
      selectedFiles.forEach(file => {
        formData.append("images", file, file.name);
      });

      try {
        const response = await fetch("https://api.lixwey.ru/report", {
          method: "POST",
          body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
          alert(`Спасибо! Ваше обращение №${data.report_id} принято.`);
          
          form.reset();
          selectedFiles = [];
          renderPreviews();
          
          // Сбрасываем защиту от закрытия
          isFormDirty = false; 
        } else {
          alert("Ошибка: " + (data.message || "Неизвестная ошибка"));
        }
      } catch (err) {
        console.error("Fetch error:", err);
        alert("Ошибка соединения с сервером. Попробуйте позже.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });

  </script>
</body>
</html>

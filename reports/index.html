<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обратная связь — Lixwey</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        h1 { color: #1456A0; margin-bottom: 8px; }
        .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 16px;
            background: #fafafa;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4A90D9;
            background: white;
        }
        textarea { resize: vertical; min-height: 120px; }
        button {
            width: 100%;
            padding: 14px;
            background: #4A90D9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1456A0; }
        .back {
            display: inline-block;
            margin-bottom: 16px;
            color: #4A90D9;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← На главную</a>
        <div class="card">
            <h1>Обратная связь</h1>
            <p class="subtitle">Опишите проблему или предложение. Мы обязательно рассмотрим.</p>

            <form action="https://formspree.io/f/ТВОЙ_КОД" method="POST">
                <label for="type">Тип обращения</label>
                <select id="type" name="type" required>
                    <option value="bug">Баг</option>
                    <option value="suggestion">Предложение</option>
                    <option value="abuse">Жалоба на пользователя</option>
                    <option value="other">Другое</option>
                </select>

                <label for="email">Ваш email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="message">Сообщение</label>
                <textarea id="message" name="message" placeholder="Опишите ситуацию..." required></textarea>

                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>
</body>
</html>
